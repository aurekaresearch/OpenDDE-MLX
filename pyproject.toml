[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "opendde-mlx"
dynamic = ["version"]
description = "OpenDDE biomolecular co-folding on Apple Silicon with MLX"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aureka AI Research", email = "ai@aureka.com" }]
keywords = [
  "alphafold3",
  "protein-structure-prediction",
  "structural-biology",
  "drug-design",
  "diffusion-model",
  "mlx",
  "apple-silicon",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Operating System :: MacOS :: MacOS X",
]

dependencies = [
  "mlx>=0.30.0",
  "click>=8.1.0",
  "scipy>=1.9.0",
  "ml_collections==1.1.0",
  "tqdm>=4.66",
  "pandas>=2.2",
  "rdkit==2025.9.3",
  "biopython==1.85",
  "biotite==1.4.0",
  "scikit-learn>=1.5",
  "pydantic>=2.0.0",
  "numpy>=2.0",
  "networkx>=3.4.2",
  "packaging>=23.2",
  "requests>=2.31.0",
]

[project.optional-dependencies]
# PyTorch (CPU) is only needed to convert the released .pt checkpoints.
convert = ["torch>=2.4"]

[project.urls]
Homepage = "https://github.com/aurekaresearch/OpenDDE-MLX"
Repository = "https://github.com/aurekaresearch/OpenDDE-MLX"
Changelog = "https://github.com/aurekaresearch/OpenDDE-MLX/blob/main/CHANGELOG.md"
Upstream = "https://github.com/aurekaresearch/OpenDDE"

[project.scripts]
opendde = "runner.cli:opendde_cli"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "torch>=2.4"]
release = ["twine>=5.1"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["opendde*", "runner*"]
exclude = ["assets*", "benchmark*", "docs*", "examples*", "scripts*", "tests*"]

[tool.setuptools.package-data]
"opendde.config" = ["model_manifest.json"]

[tool.setuptools.dynamic]
version = { attr = "opendde.version.__version__" }

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = [
  "network: tests that access external network services",
  "parity: tests that compare against PyTorch reference outputs",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".ruff_cache", ".venv", "output"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
