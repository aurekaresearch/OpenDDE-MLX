name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          cache-dependency-glob: pyproject.toml
      - name: Install lint environment
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python --group dev
      - name: Run lint
        run: .venv/bin/ruff check .
      - name: Check formatting
        run: .venv/bin/ruff format --check .

  tests:
    name: Python ${{ matrix.python-version }} on Apple Silicon
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Configure test data root
        run: |
          mkdir -p "${RUNNER_TEMP}/opendde_data"
          echo "OPENDDE_ROOT_DIR=${RUNNER_TEMP}/opendde_data" >> "${GITHUB_ENV}"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          cache-dependency-glob: pyproject.toml
      - name: Install OpenDDE-MLX
        run: |
          uv venv --python "${{ matrix.python-version }}"
          uv pip install --python .venv/bin/python -e .
          uv pip install --python .venv/bin/python --group dev
      - name: Run tests
        # Parity tests need the upstream PyTorch checkout and reference dumps.
        run: .venv/bin/python -m pytest tests -q -m "not network and not parity"
      - name: Smoke-test the CLI
        run: |
          .venv/bin/opendde-mlx --help > /dev/null
          .venv/bin/opendde-mlx doctor
